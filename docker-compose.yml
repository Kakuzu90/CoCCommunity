# Clash Commons local dev stack. Laravel app lives in ./src.
# No Redis by design — cache, queue and sessions use the database driver.
# Media: MinIO locally (S3-compatible, presigned URLs work the same),
# Cloudflare R2 in staging/production. Swapping is an .env change only.

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: coccommunity-app:local
  volumes:
    - ./src:/var/www/html
  networks:
    - coc
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app
    # php-fpm (default CMD). Serves the web tier via nginx.

  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - coc

  # Queue topology from specs/20 §1: one worker per queue group. --rest keeps idle database-queue
  # workers from hammering Postgres; --max-time recycles hourly to bound leaks and pick up deploys.
  # restart + stop_grace_period give the worker-liveness and graceful-drain behaviour of §5.
  queue-default:
    <<: *app
    command: php artisan queue:work database --queue=high,default --tries=3 --sleep=1 --rest=0.2 --max-time=3600
    restart: unless-stopped
    stop_grace_period: 130s
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  # Media runs on the database-media connection (retry_after 1200 > the 900s job timeout) so a long
  # re-encode is never re-reserved mid-flight (specs/20 §5). CPU-heavy, so memory-capped and recycled.
  queue-media:
    <<: *app
    command: php artisan queue:work database-media --queue=media --tries=2 --sleep=3 --max-time=3600 --memory=512
    restart: unless-stopped
    stop_grace_period: 950s
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  queue-lowsync:
    <<: *app
    command: php artisan queue:work database --queue=sync,low --tries=3 --sleep=2 --max-time=3600
    restart: unless-stopped
    stop_grace_period: 310s
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  scheduler:
    <<: *app
    command: sh -c "while :; do php artisan schedule:run --no-interaction; sleep 60; done"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-coc}
      POSTGRES_USER: ${DB_USERNAME:-coc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-coc} -d ${DB_DATABASE:-coc}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - coc

  # Web DB GUI (the Postgres equivalent of phpMyAdmin). Profile `tools`. UI at http://localhost:8081
  adminer:
    image: adminer:latest
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    depends_on:
      - db
    networks:
      - coc
    profiles:
      - tools

  # Local mail catcher for email verification / password resets. UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - coc

  # S3-compatible object storage for local dev, standing in for Cloudflare R2.
  # Same API and presigned-URL flow, so the media pipeline is exercised for real.
  # Profile `storage` — start it for any media work:  docker compose --profile storage up -d
  # Console at http://localhost:9001 (minioadmin / minioadmin).
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - coc
    profiles:
      - storage

  # One-shot: creates the bucket and makes the public/ and game/ prefixes readable,
  # mirroring the R2 + CDN binding described in specs/10-media-storage.md.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_BUCKET: ${AWS_BUCKET:-clashcommons-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$AWS_BUCKET &&
      mc anonymous set download local/$$AWS_BUCKET/public &&
      mc anonymous set download local/$$AWS_BUCKET/game &&
      echo 'minio ready: bucket '$$AWS_BUCKET' with public/ and game/ readable'
      "
    networks:
      - coc
    profiles:
      - storage

  # Vite dev server for Livewire/Tailwind assets. Runs only when ./src has a package.json.
  node:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    networks:
      - coc
    profiles:
      - assets

networks:
  coc:
    driver: bridge

volumes:
  pgdata:
  miniodata:
