# Public interfaces, presentation-only actions/queries, and private module internals.
# New modules must be classified here; uncovered dependencies fail CI.
imports:
  - resource: deptrac.allowlist
    type: yaml
deptrac:
  paths:
    - ./app
  layers:
    - name: AuthPublic
      collectors:
        - type: classLike
          value: '^App\\Domain\\Auth\\(Contracts|Services|Data|Events|Enums)\\.*$'
    - name: AuthApplication
      collectors:
        - type: classLike
          value: '^App\\Domain\\Auth\\(Actions|Queries)\\.*$'
    - name: AuthInternal
      collectors:
        - type: classLike
          value: '^App\\Domain\\Auth\\(?!(?:Contracts|Services|Data|Events|Enums|Actions|Queries)\\).*$'
    - name: UsersPublic
